[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnlab-attack-mapper"
version = "0.1.0"
description = "Evidence-based MITRE ATT&CK mapping for Red Team reports"
requires-python = ">=3.10"

[project.scripts]
attack-mapper = "attack_mapper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
